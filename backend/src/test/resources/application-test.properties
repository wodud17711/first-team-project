# ===== 통합 테스트용 프로필 (H2 인메모리) =====
# @SpringBootTest 와 함께 @ActiveProfiles("test") 로 활성화한다.
# 운영/local 의 MySQL daengion 과 격리된 환경.

# H2 인메모리. MODE=MySQL 로 MySQL 문법 흉내 (한글 ENUM 등 호환성).
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA: Entity 기반 schema 자동 생성. 테스트마다 깨끗이 초기화.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# 시드 로딩 비활성 — dog_breeds_seed.sql 은 운영용이라 테스트에서는 skip.
# 견종 없이 (breedId=null, Mix) 시나리오 검증.
spring.sql.init.mode=never

# JWT — 테스트 전용 dev 키 (실제 운영 키 아님).
jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1pbnRlZ3JhdGlvbi10ZXN0aW5nLXB1cnBvc2VzLW9ubHk=

# E2E 테스트는 signup 을 직접 호출하므로 이메일 인증 게이트를 끈다.
# (인증 플로우 자체는 EmailVerificationServiceTest 단위 테스트로 커버)
app.auth.email-verification=false
