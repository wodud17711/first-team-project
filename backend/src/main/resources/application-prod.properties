# ============================================================
# 운영(prod) 프로필 — 실행: 환경변수 SPRING_PROFILES_ACTIVE=prod
# 모든 시크릿/URL 은 환경변수로 주입(레포 미커밋). 여기엔 값 없이 키 placeholder 만 둔다.
# 배포 스택: BE(Render) · DB(Aiven MySQL) · FE(Vercel) · AI(FastAPI on Render)
# 필요한 운영 환경변수(Render):
#   DB_URL · DB_USERNAME · DB_PASSWORD · JWT_SECRET · CORS_ALLOWED_ORIGINS · AI_BASE_URL
#   WEATHER_API_KEY · LIVING_WEATHER_API_KEY · KMA_HUB_KEY · AIRKOREA_API_KEY · UPLOAD_DIR(선택)
# ============================================================

# ===== 서버 포트 (Render) =====
# Render 는 컨테이너에 PORT 환경변수를 주입하고 그 포트로 트래픽을 라우팅한다.
# Spring 은 기본적으로 PORT 를 안 읽으므로 명시 매핑(미설정 시 8081 폴백).
# (오연수 #140 에서 캐치한 Render 포트 매핑 반영)
server.port=${PORT:8081}

# ===== DataSource: Aiven MySQL (SSL) =====
# DB_URL 예) jdbc:mysql://<host>:<port>/<db>?sslMode=REQUIRED&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useUnicode=true&allowPublicKeyRetrieval=true
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA: 운영은 스키마 자동 변경 금지 =====
# create 금지(부팅마다 데이터 소실). validate = 엔티티↔실DB 스키마 일치 검증만 수행.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# ===== SQL Init: 운영은 시드 자동 실행 안 함 =====
# schema.sql(v1.4) + dog_breeds_seed.sql(394종) + categories_seed.sql 은 운영 DB 에 1회 수동 적용.
spring.sql.init.mode=never

# ===== JWT 시크릿 (env, 필수) =====
jwt.secret=${JWT_SECRET}

# ===== CORS: 운영 FE(Vercel) 도메인 (콤마 구분 가능, env 필수) =====
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ===== AI(FastAPI) base-url: 운영 Render AI 주소 (env 필수) =====
# RestClient HTTP/1.1 고정은 RestClientConfig 에서 처리(uvicorn h11 호환).
ai.base-url=${AI_BASE_URL}

# ===== AI 워밍업 스케줄러 (콜드스타트 완화) =====
# Render 무료 슬립(15분) 대응: BE 활성 중 FastAPI /health 를 10분 주기로 핑해 깨워둠.
# BE 자체가 슬립하면 함께 멈추므로 완전 해결은 아님(발표 전 워밍 병행). 운영만 on.
app.ai.warmup.enabled=true

# ===== Cookie: 운영 HTTPS → Secure 필수 =====
app.cookie.secure=true
# FE(Vercel)·BE(Render)가 서로 다른 사이트 → 크로스사이트 요청에 RT 쿠키가 실리도록 None.
# (None 은 Secure 동반 필수 — 위 secure=true 로 충족)
app.cookie.same-site=None

# ===== OAuth 소셜 로그인 (카카오) =====
# Render env: KAKAO_CLIENT_ID(REST API 키) · KAKAO_CLIENT_SECRET(선택) 필수 주입.
kakao.client-id=${KAKAO_CLIENT_ID}
kakao.client-secret=${KAKAO_CLIENT_SECRET:}
kakao.redirect-uri=${KAKAO_REDIRECT_URI:https://daengion-api.onrender.com/api/auth/oauth/kakao/callback}
app.oauth.success-redirect=${OAUTH_SUCCESS_REDIRECT:https://first-team-project-two.vercel.app/oauth/callback}

# ===== 이미지 업로드 =====
# ⚠️ Render 무료는 디스크 비영구 → 재시작/재배포 시 업로드 파일 소실. (후속: S3 등 외부 스토리지)
app.upload.dir=${UPLOAD_DIR:uploads}
