# ============================================================
# 운영(prod) 프로필 — 실행: 환경변수 SPRING_PROFILES_ACTIVE=prod
# 모든 시크릿/URL 은 환경변수로 주입(레포 미커밋). 여기엔 값 없이 키 placeholder 만 둔다.
# 배포 스택: BE(Render) · DB(Aiven MySQL) · FE(Vercel) · AI(FastAPI on Render)
# 필요한 운영 환경변수(Render):
#   DB_URL · DB_USERNAME · DB_PASSWORD · JWT_SECRET · CORS_ALLOWED_ORIGINS · AI_BASE_URL
#   WEATHER_API_KEY · LIVING_WEATHER_API_KEY · KMA_HUB_KEY · AIRKOREA_API_KEY · UPLOAD_DIR(선택)
# ============================================================

# ===== DataSource: Aiven MySQL (SSL) =====
# DB_URL 예) jdbc:mysql://<host>:<port>/<db>?sslMode=REQUIRED&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useUnicode=true&allowPublicKeyRetrieval=true
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA: 운영은 스키마 자동 변경 금지 =====
# create 금지(부팅마다 데이터 소실). validate = 엔티티↔실DB 스키마 일치 검증만 수행.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# ===== SQL Init: 운영은 시드 자동 실행 안 함 =====
# schema.sql(v1.4) + dog_breeds_seed.sql(394종) + categories_seed.sql 은 운영 DB 에 1회 수동 적용.
spring.sql.init.mode=never

# ===== JWT 시크릿 (env, 필수) =====
jwt.secret=${JWT_SECRET}

# ===== CORS: 운영 FE(Vercel) 도메인 (콤마 구분 가능, env 필수) =====
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ===== AI(FastAPI) base-url: 운영 Render AI 주소 (env 필수) =====
# RestClient HTTP/1.1 고정은 RestClientConfig 에서 처리(uvicorn h11 호환).
ai.base-url=${AI_BASE_URL}

# ===== Cookie: 운영 HTTPS → Secure 필수 =====
app.cookie.secure=true

# ===== 이미지 업로드 =====
# ⚠️ Render 무료는 디스크 비영구 → 재시작/재배포 시 업로드 파일 소실. (후속: S3 등 외부 스토리지)
app.upload.dir=${UPLOAD_DIR:uploads}
