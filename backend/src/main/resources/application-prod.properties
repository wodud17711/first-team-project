# ===== 운영(prod) 프로필 — Render 배포용 =====
# 활성화: Render 환경변수 SPRING_PROFILES_ACTIVE=prod
# application.properties(공통) 위에 override 로 적용된다. 실값/주소는 모두 환경변수로 주입 —
# 이 파일에는 비밀값·운영 도메인을 직접 적지 않는다(레포 미커밋 원칙 유지).

# ===== 서버 포트 =====
# Render 는 컨테이너에 PORT 환경변수를 주입하고 그 포트로 트래픽을 라우팅한다.
# Spring 은 기본적으로 PORT 를 안 읽으므로 명시 매핑. (로컬 prod 검증 시 8081 폴백)
server.port=${PORT:8081}

# ===== DB: Aiven MySQL (SSL) =====
# DB_URL 에는 Aiven JDBC URL + SSL 파라미터(sslMode/useSSL 등)를 그대로 넣는다.
# 운영 인스턴스에는 schema.sql(v1.4) + dog_breeds_seed.sql(394종)이 1회 적용되어 있어야 한다.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA =====
# 운영은 스키마 검증만 — 부팅마다 DROP/CREATE 금지(데이터 보존). 스키마는 수동 관리.
spring.jpa.hibernate.ddl-auto=validate
# 시드 SQL 미실행 → defer 도 불필요.
spring.jpa.defer-datasource-initialization=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# ===== 시드 로딩 비활성 =====
# 운영 DB 에 견종 시드가 이미 적용됨. always 면 부팅마다 재실행되어 중복키 오류 → never.
spring.sql.init.mode=never

# ===== AI 서버 (Render, FastAPI) =====
# 배포 후 Render AI URL 을 환경변수 AI_BASE_URL 로 주입. 미설정 시 로컬 폴백(호출만 실패).
ai.base-url=${AI_BASE_URL:http://localhost:8000}

# ===== 쿠키 =====
# 운영 HTTPS — Refresh Token 쿠키 Secure 필수(공통 기본값 true, 명시 유지).
app.cookie.secure=true

# 참고: JWT_SECRET, WEATHER_API_KEY, LIVING_WEATHER_API_KEY, KMA_HUB_KEY, AIRKOREA_API_KEY,
#       CORS_ALLOWED_ORIGINS 는 application.properties / CorsConfig 에서 env 로 바인딩되므로
#       여기 재선언하지 않는다. Render 환경변수에만 실값을 넣는다.
