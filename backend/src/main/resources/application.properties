spring.application.name=demo

# 서버 포트 (8080이 사용 중이라 8081로 변경)
server.port=8081

# AI(FastAPI) 호출 base-url. 운영은 환경변수 AI_BASE_URL 로 주입(Render AI 주소).
ai.base-url=${AI_BASE_URL:http://localhost:8000}

# 활성 프로필 (운영은 SPRING_PROFILES_ACTIVE=prod 환경변수로 override)
spring.profiles.active=local

# JWT
# 값은 active profile 파일(application-local.properties)에서 주입.
# 운영은 환경변수 JWT_SECRET 가 jwt.secret 으로 자동 매핑됨 (Spring relaxed binding).

# ===== JPA =====
# 매 부팅마다 25테이블 DROP & CREATE (학습 dev 정책. 운영은 prod profile + Flyway 별도)
spring.jpa.hibernate.ddl-auto=create
# JPA가 DDL 만든 뒤 data.sql/시드 SQL 실행 (순서 보장)
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# ===== SQL Init (시드 로딩) =====
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/seed/dog_breeds_seed.sql,classpath:db/seed/categories_seed.sql
spring.sql.init.encoding=UTF-8

# ===== 외부 API: 기상청 단기예보 =====
# serviceKey 값은 환경변수 WEATHER_API_KEY 로 주입 (레포 미커밋).
# 디코딩(평문) 키를 넣는다 — UriBuilder 가 인코딩 처리.
# 기본값 빈 문자열: env 미설정(CI/테스트)에서도 컨텍스트는 뜨고, 실제 호출만 실패.
weather.base-url=http://apis.data.go.kr/1360000/VilageFcstInfoService_2.0
weather.api-key=${WEATHER_API_KEY:}

# ===== 외부 API: 기상청 생활기상지수(자외선, getUVIdxV5) =====
# 단기예보와 다른 서비스. 신청 내역 = "생활기상지수 조회서비스(3.0)" → 경로 LivingWthrIdxServiceV5.
# 실측 확인(2026-06-17): V5/getUVIdxV5 + 공공데이터포털 공통 인증키 → resultCode 00 정상.
# serviceKey 값은 환경변수 LIVING_WEATHER_API_KEY 로 주입 (레포 미커밋, 디코딩 평문 키 = 단기예보와 동일 키).
livingweather.base-url=http://apis.data.go.kr/1360000/LivingWthrIdxServiceV5
livingweather.api-key=${LIVING_WEATHER_API_KEY:}

# ===== 외부 API: 기상청 API허브 ASOS 지상관측 (kma_sfctm3.php) =====
# 지면온도(TS) 보강용 — 폭염 룰 발바닥 화상 판단 입력. 단기예보/생활기상지수와 다른 서비스.
# authKey 는 환경변수 KMA_HUB_KEY 로 주입 (레포 미커밋).
# 발급: apihub.kma.go.kr 가입 → 마이페이지 인증키 (영구, 기관 단일 키로 전체 API 사용).
kma.hub.base-url=https://apihub.kma.go.kr/api/typ01/url
kma.hub.api-key=${KMA_HUB_KEY:}

# ===== 외부 API: 에어코리아 대기오염정보 (getCtprvnRltmMesureDnsty) =====
# 미세먼지(pm10)·초미세먼지(pm25) 보강용 — 룰베이스 미세먼지 가중치 입력.
# serviceKey 값은 환경변수 AIRKOREA_API_KEY 로 주입 (레포 미커밋, 디코딩 평문 키).
airkorea.base-url=http://apis.data.go.kr/B552584/ArpltnInforInqireSvc
airkorea.api-key=${AIRKOREA_API_KEY:}

# ===== 이미지 업로드 (v3.7) =====
# 저장 루트(작업 디렉터리 기준 상대경로). 운영은 환경변수 UPLOAD_DIR 로 override.
# /uploads/** 로 정적 서빙(WebConfig). 디렉터리 자체는 .gitignore (저장 파일 미커밋).
app.upload.dir=${UPLOAD_DIR:uploads}
# 5MB 초과 시 MaxUploadSizeExceededException → INVALID_FILE(400). request 는 멀티파트 오버헤드 여유.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ===== Cookie =====
# Refresh Token 쿠키 Secure 플래그.
# 운영(HTTPS)은 반드시 true. 로컬 dev(HTTP)는 application-local.properties 에서 false 로 override.
app.cookie.secure=true
# RT 쿠키 SameSite. 로컬(localhost 동일 사이트)=Lax 기본. 운영(FE·BE 다른 사이트)=None 으로 override(prod).
app.cookie.same-site=Lax

# ===== OAuth 소셜 로그인 (카카오/구글/네이버) =====
# client-id = 카카오 REST API 키, client-secret = 카카오 로그인 Client Secret(선택).
# 값은 환경변수로 주입(레포 미커밋). 미설정 시 빈값 → 컨텍스트는 뜨고 소셜 로그인만 비활성.
kakao.client-id=${KAKAO_CLIENT_ID:}
kakao.client-secret=${KAKAO_CLIENT_SECRET:}
kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8081/api/auth/oauth/kakao/callback}
# 구글: Google Cloud Console OAuth 클라이언트 (승인된 리디렉션 URI 에 redirect-uri 등록 필요).
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8081/api/auth/oauth/google/callback}
# 네이버: 네이버 개발자센터 애플리케이션 (네이버 로그인 API, 콜백 URL 등록 필요).
naver.client-id=${NAVER_CLIENT_ID:}
naver.client-secret=${NAVER_CLIENT_SECRET:}
naver.redirect-uri=${NAVER_REDIRECT_URI:http://localhost:8081/api/auth/oauth/naver/callback}
# 소셜 로그인 성공 후 돌아갈 FE 주소 (RT 쿠키 set 후 리다이렉트, FE 가 refresh 로 AT 획득).
app.oauth.success-redirect=${OAUTH_SUCCESS_REDIRECT:http://localhost:5173/oauth/callback}

# ===== Mail (회원가입 이메일 인증) =====
# 가입 시 이메일 인증 강제 여부 (test 프로필에서만 false — E2E 가 signup 직접 호출).
app.auth.email-verification=${EMAIL_VERIFICATION_ENABLED:true}
# Gmail SMTP: username = 발신 Gmail 주소, password = 앱 비밀번호(2단계 인증 필요, 일반 비번 아님).
# 값은 환경변수로 주입(레포 미커밋). 미설정 시 빈값 → 컨텍스트는 뜨고 인증 메일 발송만 실패(MAIL_SEND_ERROR).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
# Brevo HTTPS 메일 API 키 — 설정 시 SMTP 대신 HTTPS(443)로 발송.
# Render 무료 티어가 아웃바운드 SMTP(25/465/587)를 차단하므로 운영은 이 키 필수 (발신자는 Brevo Senders 에 등록돼야 함).
brevo.api-key=${BREVO_API_KEY:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

