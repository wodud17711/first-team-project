name: CI

# develop / main 으로 향하는 PR마다 백엔드 빌드를 검사한다.
# 빌드 실패 시 머지 버튼이 비활성화되도록, 브랜치 보호 규칙에서
# 이 'build' 체크를 "Require status checks to pass"에 추가하세요.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        working-directory: backend
        run: chmod +x ./gradlew

      - name: Build & Test (backend)
        working-directory: backend
        run: ./gradlew build --no-daemon
